name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code
      - name: Validate plugin manifest
        run: claude plugin validate .
      - name: Contract greps and manifest script tests (python3 ships on ubuntu-latest)
        run: bash scripts/check-contract.sh

  # Behavioral suite. Manual dispatch only: it needs an API key and spends tokens.
  # Model and judge are pinned so a model rollout is not read as a plugin regression;
  # the local command in evals/README.md floats on purpose.
  # (about 5 USD per single-run pass). Linux has a working git inside the eval
  # sandbox; macOS needs a standalone git such as Homebrew's (see evals/README.md).
  evals:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code
      - name: Run eval suite
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: claude plugin eval . --trust-plugin --scaffold --ablation none --runs 1 --max-cost-usd 20 --allow-tools Bash Write Edit --threshold 0.8 --no-publish --model claude-opus-5-5 --judge-model claude-sonnet-5-5 --json results.json
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: results.json
